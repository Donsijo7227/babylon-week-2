<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 2 - Import Model | COMP2144</title>
    <style>
        /* STEP 1: Have a look at some of the interesting CSS used to make sure the entire browser window object is used for the purpose of the Babylon.js Web app */
        html,
        body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }  
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
    </style>
    <!-- STEP 2: Examine the JavaScript dependencies served up from a CDN - which is fine for development -->  
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <!-- The below script tag is used to include PEP.js (Performance Evaluation Profiler) - a JavaScript library that helps you measure the performance of your web application (credit Gemini 1.5). -->
    <script src="https://code.jquery.com/pep/0.4.3/pep.js"></script>
</head>
<body>
    <!-- STEP 3: Create a canvas element with an id, and set the touch-action attribute to "none" -->
    <canvas id="renderCanvas" touch-action="none"></canvas>
    <!-- touch-action="none" for best results from PEP -->
 
    <script>
        // STEP 4: Get the canvas element as a const
        const canvas = document.getElementById("renderCanvas")
        // STEP 5: Create the BABYON 3D engine, and attach it to the canvas
        const engine = new BABYLON.Engine(canvas, true)
        // STEP 6: Build the createScene function
        const createScene = function(){
            // STEP 8a: Create a new BABYLON scene, passing in the engine as an argument
            const scene = new BABYLON.Scene(engine)
            const ground = BABYLON.MeshBuilder.CreateGround("ground",{height: 6, width: 8, subdivisions: 10});
            const groundMaterial = new BABYLON.StandardMaterial("groundMaterial", scene);
            groundMaterial.diffuseColor = new BABYLON.Color3(0, 1, 0);
            ground.material = groundMaterial;

           

            const boxColor = new BABYLON.StandardMaterial("boxColor", scene);
            boxColor.diffuseColor = new BABYLON.Color3(1,1,1)
            
            
            const box1 = BABYLON.MeshBuilder.CreateBox("box", {}); // Create box mesh object
            box1.position.y=0.5;
            box1.position.x=-2;
            box1.position.z=1;
            box1.material =  boxColor;
            const box2 = BABYLON.MeshBuilder.CreateBox("box", {}); // Create box mesh object
            box2.position.y=1;
            box2.position.x=-2;
            box2.position.z=1;
            const box3 = BABYLON.MeshBuilder.CreateBox("box", {}); // Create box mesh object
            box3.position.y=1.5;
            box3.position.x=-2;
            box3.position.z=1;
            const box4 = BABYLON.MeshBuilder.CreateBox("box", {}); // Create box mesh object
            box4.position.y=2;
            box4.position.x=-2;
            box4.position.z=1;
            const box5 = BABYLON.MeshBuilder.CreateBox("box", {}); // Create box mesh object
            box5.position.y=2;
            box5.position.x=-1;
            box5.position.z=1;
            const box6 = BABYLON.MeshBuilder.CreateBox("box", {}); // Create box mesh object
            box6.position.y=2;
            box6.position.x=0;
            box6.position.z=1;
            const box7 = BABYLON.MeshBuilder.CreateBox("box", {}); // Create box mesh object
            box7.position.y=2;
            box7.position.x=1;
            box7.position.z=1;
            const box8 = BABYLON.MeshBuilder.CreateBox("box", {}); // Create box mesh object
            box8.position.y=2;
            box8.position.x=2;
            box8.position.z=1;
            const box9 = BABYLON.MeshBuilder.CreateBox("box", {}); // Create box mesh object
            box9.position.y=0.5;
            box9.position.x=2;
            box9.position.z=1;
            const box10 = BABYLON.MeshBuilder.CreateBox("box", {}); // Create box mesh object
            box10.position.y=1;
            box10.position.x=2;
            box10.position.z=1;
        
            const house = BABYLON.SceneLoader.Append("https://assets.babylonjs.com/meshes/", "haunted_house.glb",scene);
            // house.scaling.y = 2;
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 2.5, 15, new BABYLON.Vector3(0, 0, 0)); // Add Arc Rotate Camera
            camera.attachControl(canvas, true); // Attach camera control to the canvas
            // Replace the above camera with the below XR if you have a headset
            // const xr = scene.createDefaultXRExperienceAsync();
 
            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(1, 1, 0));
            // STEP 8b: Return the scene
            return scene;
        } 
        // STEP 7: Call the createScene function
         const scene = createScene();
        // STEP 8: Use the runRenderLoop() method to render the scene repeatedly
        engine.runRenderLoop(function(){
            scene.render();
        })
        // STEP 9: Add an event listener that adapts to the user resizing the screen
        window.addEventListener("resize",function(){
            engine.resize();
        })
        // STEP 10: Move the page up to a server (maybe GitHub Pages) and try it out!
    </script>
</body>
</html>
